inherit_from: configs/Tum/tum.yaml
mapping:
  first_mesh: False
  bound: [[-6.,6],[-5,6],[-1.,3.]] # [[-5.,5.],[-5.,5.],[-5.,5.]]
  marching_cubes_bound: [[-8.,7.5],[-7.5,7.5],[-1.,3.]] # [[-5.,5.],[-5.,5.],[-5.,5.]]

data:
  datadir: ../data/TUM/rgbd_dataset_freiburg3_long_office_household
  trainskip: 1
  output: output/TUM/fr_office
  exp_name: 19_base

cam:  #intrinsic is different per scene in TUM, this cam does not have distortion
  H: 480 
  W: 640
  fx: 535.4
  fy: 539.2
  cx: 320.1
  cy: 247.6
  crop_edge: 8
  crop_size: [384,512]
  near: 0
  far: 5

mesh:
  vis: 1000000000
  visualisation: False

timing:
  mode: none
  warmup_frames: 0
  max_frames: null
  disable_eval: True
  scene_output_csv: ./results/layer_timing/Tum/fr3_office_scene_rep_timing.csv
  coslam_output_csv: ./results/layer_timing/Tum/fr3_office_coslam_layer_timing.csv
  frame_total_output_csv: ./results/frame_total/Tum/fr3_office_frame_total_timing_complete_pruning.csv
  frame_total_write_header: False
