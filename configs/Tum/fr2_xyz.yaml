inherit_from: configs/Tum/tum.yaml
mapping:
  first_mesh: False
  bound: [[-0.5, 8],[-3.5,3],[-0.3,3.0]] # [[0.0, 8.5],[-3,3],[-0.3,2.0]]
  marching_cubes_bound: [[-0.5, 8],[-3.5,3],[-0.3,3.0]] #[[0.0, 8.5],[-3,3],[-0.3,2.0]]

data:
  datadir: ../data/TUM/rgbd_dataset_freiburg2_xyz
  trainskip: 1
  output: output/TUM/fr_xyz
  exp_name: 19_base

cam:  #intrinsic is different per scene in TUM
  H: 480 
  W: 640
  fx: 520.9
  fy: 521.0
  cx: 325.1
  cy: 249.7
  crop_edge: 8
  crop_size: [384,512]
  distortion: [0.2312, -0.7849, -0.0033, -0.0001, 0.9172]
  near: 0
  far: 6
  depth_trunc: 5.

mesh:
  vis: 1000000000
  visualisation: False

timing:
  mode: none
  warmup_frames: 0
  max_frames: null
  disable_eval: True
  scene_output_csv: ./results/layer_timing/Tum/fr2_xyz_scene_rep_timing.csv
  coslam_output_csv: ./results/layer_timing/Tum/fr2_xyz_coslam_layer_timing.csv
  frame_total_output_csv: ./results/frame_total/Tum/fr2_xyz_frame_total_timing_complete_pruning.csv
  frame_total_write_header: False
