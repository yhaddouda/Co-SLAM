inherit_from: configs/Tum/tum.yaml
mapping:
  first_mesh: False
  bound: [[-3.5,3],[-3,3],[-3,3]]
  marching_cubes_bound: [[-3.5,3],[-3,3],[-3,3]]
data:
  datadir: ../data/TUM/rgbd_dataset_freiburg1_desk
  trainskip: 1
  output: output/TUM/fr_desk
  exp_name: 19_base

cam:  #intrinsic is different per scene in TUM
  H: 480 
  W: 640 
  fx: 517.3
  fy: 516.5
  cx: 318.6
  cy: 255.3
  crop_edge: 8
  crop_size: [384,512]
  distortion: [0.2624, -0.9531, -0.0054, 0.0026, 1.1633]

mesh:
  vis: 1000000000
  visualisation: False

timing:
  mode: none
  warmup_frames: 0
  max_frames: null
  disable_eval: True
  scene_output_csv: ./results/layer_timing/Tum/fr1_desk_scene_rep_timing.csv
  coslam_output_csv: ./results/layer_timing/Tum/fr1_desk_coslam_layer_timing.csv
  frame_total_output_csv: ./results/frame_total/Tum/fr1_desk_frame_total_timing_complete_pruning.csv
  frame_total_write_header: False
