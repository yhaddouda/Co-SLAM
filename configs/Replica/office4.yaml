inherit_from: configs/Replica/replica.yaml
mapping:
  first_mesh: False
  bound: [[-1.4,5.5],[-2.5,4.4],[-1.4,1.8]]
  marching_cubes_bound: [[-1.3,5.4],[-2.4,4.3],[-1.3,1.7]]


data:
  datadir: ../datasets/data/Replica/office4
  trainskip: 1
  output: output/Replica/office4
  exp_name: "quality"

mesh:
  vis: 1000000000
  visualisation: False

timing:
  mode: coslam   # options: none, scene_rep, coslam
  warmup_frames: 11
  max_frames: 60
  disable_eval: True
  scene_output_csv: ./office4_scene_rep_timing_cropped.csv
  coslam_output_csv: ./office4_coslam_layer_timing_cropped.csv

# Add profiling config here
profiling:
  enabled: False
  output_dir: ./profiling/PytorchProfiler/office4
  schedule:
    wait: 1
    warmup: 0
    active: 10
    repeat: 1