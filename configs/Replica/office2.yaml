inherit_from: configs/Replica/replica.yaml
mapping:
  first_mesh: False
  bound: [[-3.6,3.2],[-3.0,5.5],[-1.4,1.7]]
  marching_cubes_bound: [[-3.5,3.1],[-2.9,5.4],[-1.3,1.6]]
  

data:
  datadir: ../datasets/data/Replica/office2
  trainskip: 1
  output: output/Replica/office2
  exp_name: "quality"

mesh:
  vis: 1000000000
  visualisation: False

timing:
  mode: coslam   # options: none, scene_rep, coslam
  warmup_frames: 11
  max_frames: 60
  disable_eval: True
  scene_output_csv: ./office2_scene_rep_timing_cropped.csv
  coslam_output_csv: ./office2_coslam_layer_timing_cropped.csv

# Add profiling config here
profiling:
  enabled: False
  output_dir: ./profiling/PytorchProfiler/office2
  schedule:
    wait: 1
    warmup: 0
    active: 10
    repeat: 1