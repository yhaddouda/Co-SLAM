dataset: 'replica'

data:
  downsample: 1
  sc_factor: 1
  translation: 0
  num_workers: 4

mapping:
  sample: 2048
  first_mesh: True
  iters: 10
  cur_frame_iters: 0
  lr_embed: 0.01
  lr_decoder: 0.01
  lr_rot: 0.001
  lr_trans: 0.001
  keyframe_every: 5
  map_every: 5
  n_pixels: 0.05
  first_iters: 200
  optim_cur: True
  min_pixels_cur: 100
  map_accum_step: 1
  pose_accum_step: 5
  map_wait_step: 0
  filter_depth: False

tracking:
  iter: 10
  sample:  1024
  pc_samples: 40960
  lr_rot: 0.001
  lr_trans: 0.001
  ignore_edge_W: 20
  ignore_edge_H: 20
  iter_point: 0
  wait_iters: 100
  const_speed: True
  best: True

tracking_bucket:  # hurts quality,, because it used a different batch every iteration.
  enabled: False
  pool_factor: 10
  shuffle_bucket_order: True  # for ablation, false is supposed to hurt tracking precision
  morton_inside_bucket: False  # use existing 3D fast-Morton sample sorting per bucket
  debug_log: False

tracking_naive_pruning:
  enabled: False  # If false, defaults to regular tracking without pruning
  morton_sort: False  # use existing 3D fast-Morton sample sorting during naive tracking
  debug_log: False
  collect_stats: False
  stats_csv: ./output_csv_room2  # defaults to <data.output>/<data.exp_name>/tracking_naive_pruning_stats.csv

tracking_depth_spatial:
  enabled: False  # select one fixed spatially distributed depth-pruned batch per frame
  collect_fallback_stats: False  # one integer-only update per frame and one scene-summary CSV
  collect_sample_count_stats: True  # summarize the selected uniform-count ceiling per frame
  pool_factor: 4  # candidate pool size = pool_factor * tracking.sample
  grid_h: 8
  grid_w: 8
  min_coverage: 0.75  # minimum fraction of grid cells containing eligible rays

ba_bucket:
  enabled: False
  pool_factor: 10
  shuffle_bucket_order: True
  morton_inside_bucket: False  # use existing 3D fast-Morton sample sorting during bucketed BA
  preserve_current_ratio: True
  debug_log: False

# Optional BA-only experiments. Existing ba_bucket behavior is preserved when
# absent/default. lattice variants require ba_bucket.enabled=False; bucket_dense
# and bucket_reference require True. Tracking switches are independent.
ba_experiment:
  variant: baseline  # see docs/replica_ba_experiments.md for optional variants
  margin: 0.0  # extra distance beyond target depth + truncation for lattice variants
  # null follows the variant preset; true/false overrides each mechanism independently.
  preload_rays: null  # stage all iteration ray batches together; requires ba_bucket.enabled=False
  fast_pose_commit: null  # reuse/clone the refreshed pose batch when finalizing BA

# Optional execution experiments; ray/depth sampling and BA are unchanged.
tracking_experiment:
  # baseline | reuse_pose | device_pose | defer_best | baseline_fast
  # cache_depth | cached_fast: reuse dense depth lattice, keep per-step RNG draws
  variant: baseline  # reuse_pose, device_pose, defer_best, baseline_fast

sampling_tracking:
  mode: random
  ph: 1
  pw: 16
  sh: 1  
  sw: 16
  # cap_per_patch: 128        # uncomment to limit per-patch contribution (keeps groups)
  # shuffle_patches: false    # keep groups ordered across patches
  # seed: 0


grid:
  enc: 'HashGrid'
  tcnn_encoding: True
  hash_size:  19
  voxel_color: 0.08
  voxel_sdf: 0.02
  oneGrid: True
  hash: CoherentPrime # "Prime", "ReversedPrime", "Rng", "BaseConvert", "Morton", "CoherentPrime"
  morton_sort: False # enable/disable
  morton_R: 128        # 64..256 good defaults

pos:
  enc: 'OneBlob'
  n_bins: 16

decoder:
  geo_feat_dim: 15
  hidden_dim: 32
  num_layers: 2
  num_layers_color: 2
  hidden_dim_color: 32
  tcnn_network: False

cam:
  H: 680
  W: 1200
  fx: 600.0
  fy: 600.0
  cx: 599.5
  cy: 339.5
  png_depth_scale: 6553.5 #for depth image in png format
  crop_edge: 0
  near: 0
  far: 5
  depth_trunc: 100.

training:
  rgb_weight: 5.0
  depth_weight: 0.1
  sdf_weight: 1000
  fs_weight: 10
  eikonal_weight: 0
  smooth_weight: 0.000001
  smooth_pts: 32
  smooth_vox: 0.1
  smooth_margin: 0.05
  #n_samples: 256
  n_samples_d: 32
  range_d: 0.1
  n_range_d: 11
  n_importance: 0
  perturb: 1
  white_bkgd: False
  trunc: 0.1
  rot_rep: 'axis_angle'
  rgb_missing: 0.05


mesh:
  resolution: 512
  render_color: False
  vis: 500
  voxel_eval: 0.05
  voxel_final: 0.02
  visualisation: False
  
# Add profiling config here
profiling:
  enabled: False
  output_dir: ./profiling/PytorchProfiler/office0
  schedule:
    wait: 1
    warmup: 0
    active: 10
    repeat: 1
